name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      - name: Install frontend dependencies
        run: npm install

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Nexus API ${{ github.ref_name }}"
          releaseBody: |
            **Nexus API** es un cliente HTTP de escritorio minimalista, libre y de código abierto, construido con Tauri 2, Vue 3 y Dexie.js.

            ### Instalación
            Descarga el instalador para tu sistema operativo y ábrelo. En macOS, si macOS te avisa que la app viene de un desarrollador sin verificar, haz clic derecho sobre la app y elige "Abrir".

            ### Nuevo en esta versión
            - Pestañas múltiples de peticiones (Cmd/Ctrl+N nueva, Cmd/Ctrl+W cerrar) con respuesta por pestaña
            - Colecciones: guarda peticiones reutilizables con nombre (botón ★) y gestionalas en el sidebar
            - Cancelar petición (botón o Esc) y timeout automático de 60 s
            - Historial con deduplicación: peticiones idénticas no se duplican
            - Restaura la última petición al abrir la app
            - Métodos HEAD y OPTIONS; GET/HEAD sin body
            - Content-Type: application/json automático para bodies JSON
            - Panel de respuesta redimensionable con botón copiar
            - Botón para limpiar la URL y más atajos de teclado
            - Política de seguridad CSP habilitada
          releaseDraft: false
          prerelease: false
